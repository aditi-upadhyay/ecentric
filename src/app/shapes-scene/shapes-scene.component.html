<div class="scene-wrapper">
  <div class="background-ui">
    <header class="header">
      <div class="header-left">
        <h1>Geometric Lab</h1>
        <div class="subtitle">
          <!-- <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg> -->
          Aditi Upadhyay / 3D shapes
        </div>
      </div>
      <div class="header-right">
        <div class="status-label">STATUS DATE</div>
        <div class="status-date">June 12, 2026</div>
      </div>
    </header>

    <div class="divider"></div>

    <div class="cards-container">
      <a
        *ngFor="let shape of shapes"
        class="card-wrapper"
        [routerLink]="['/shape', shape.id]"
      >
        <div class="card">
          <img [src]="shape.imageUrl" [alt]="shape.label">
        </div>
        <div class="card-label">{{ shape.cardLabel }}</div>
      </a>
    </div>
  </div>
</div>
