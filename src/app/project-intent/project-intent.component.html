<div class="card">
  <div class="card-header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
    <h2>{{ title }}</h2>
  </div>

  <div class="quote-section" *ngIf="quote">
    {{ quote }}
  </div>

  <div class="lists-container" *ngIf="listSections && listSections.length > 0">
    <div class="list-section" *ngFor="let section of listSections">
      <h3>{{ section.title }}</h3>
      <ul>
        <li *ngFor="let item of section.items">{{ item }}</li>
      </ul>
    </div>
  </div>
</div>
