<div class="detail-wrapper">
  <a class="back-link" routerLink="/">&larr; Back to all shapes</a>
  <h1 class="detail-title">{{ shapeLabel }}</h1>

  <aside class="controls-panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg class="title-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          <path d="M2 12h20"></path>
        </svg>
        <h2>Fresnel Control</h2>
      </div>
      <label class="toggle-switch">
        <input
          type="checkbox"
          [(ngModel)]="fresnelEnabled"
          (ngModelChange)="onFresnelEnabledChange($event)"
        />
        <span class="slider round"></span>
      </label>
    </div>

    <div class="controls-content" [class.disabled]="!fresnelEnabled">
      <div class="control-row">
        <span class="control-label">EDGE COLOR</span>
        <div class="control-value-group">
          <span class="color-hex">{{ edgeColorHex | uppercase }}</span>
          <label class="color-picker-wrapper">
            <input
              type="color"
              class="control-color"
              [(ngModel)]="edgeColorHex"
              (ngModelChange)="onEdgeColorChange($event)"
              [disabled]="!fresnelEnabled"
            />
            <div class="color-preview" [style.background-color]="edgeColorHex"></div>
          </label>
        </div>
      </div>

      <div class="control-row stacked">
        <div class="control-header">
          <span class="control-label">FRESNEL STRENGTH</span>
          <span class="control-value">{{ fresnelStrength | number: '1.2-2' }}</span>
        </div>
        <input
          type="range"
          class="control-range"
          min="0"
          max="1"
          step="0.01"
          [(ngModel)]="fresnelStrength"
          (ngModelChange)="onFresnelStrengthChange($event)"
          [disabled]="!fresnelEnabled"
          [style.background]="'linear-gradient(to right, #6366f1 ' + (fresnelStrength * 100) + '%, #f1f5f9 ' + (fresnelStrength * 100) + '%)'"
        />
      </div>

      <div class="control-row stacked">
        <div class="control-header">
          <span class="control-label">EDGE ATTENUATION</span>
          <span class="control-value">{{ edgeAttenuation | number: '1.2-2' }}</span>
        </div>
        <input
          type="range"
          class="control-range"
          min="0.5"
          max="8"
          step="0.1"
          [(ngModel)]="edgeAttenuation"
          (ngModelChange)="onEdgeAttenuationChange($event)"
          [disabled]="!fresnelEnabled"
          [style.background]="'linear-gradient(to right, #6366f1 ' + ((edgeAttenuation - 0.5) / 7.5 * 100) + '%, #f1f5f9 ' + ((edgeAttenuation - 0.5) / 7.5 * 100) + '%)'"
        />
      </div>

      <div class="control-row stacked">
        <div class="control-header">
          <span class="control-label">STEEPNESS</span>
          <span class="control-value">{{ steepness | number: '1.1-1' }}</span>
        </div>
        <input
          type="range"
          class="control-range"
          min="0.1"
          max="5"
          step="0.1"
          [(ngModel)]="steepness"
          (ngModelChange)="onSteepnessChange($event)"
          [disabled]="!fresnelEnabled"
          [style.background]="'linear-gradient(to right, #6366f1 ' + ((steepness - 0.1) / 4.9 * 100) + '%, #f1f5f9 ' + ((steepness - 0.1) / 4.9 * 100) + '%)'"
        />
      </div>
    </div>
  </aside>

  <div #canvasContainer class="canvas-container"></div>
</div>
